<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="CSS/style2.css">
        <link rel="stylesheet" href="CSS/MoreStyle.css">
    </head>
    <body>
        <section class="main roboto-flex-std" >
            <div class="header"> <!-- HEADER PER LOGO -->
                <!--<h1>ConversAI logo</h1>-->
                <img id="top_banner" src="img/banner.svg"></img>
            </div>
            
            <div class="leftBar card"> <!-- sezione che viene popolata dai progetti e conversazioni popolate da script e DB -->                
                <div id="tab_progetti"> 
                    <div class="roboto-flex-bold title">Seleziona il progetto</div>
                    <div id="sel_progetti" class="body-card">
                        Inserisci un nuovo progetto
                    </div>
                    <div class="btn-card-center">
                        <button id="new_project" class="roboto-flex-bold glow arr_opener bttn" data-target_id="modal_project">Nuovo progetto</button>
                    </div>
                </div>
                
                <div id="tab_conversazioni">
                    <div class="roboto-flex-bold title">Seleziona la conversazione</div>
                    <div id="sel_conversazioni" class="body-card">
                        Seleziona un progetto oppure crea una nuova conversazione
                    </div>
                    <div class="btn-card-center">
                        <button id="new_convers" class="roboto-flex-bold glow arr_opener bttn" data-target_id="modal_conv">Nuova conversazione</button>
                    </div>
                </div>
            </div>
           

            <div class="body card"><!-- SEZIONE PRINCIPALE CHE CONTIENE UN IFRAME PER I MESSAGGI -->
                <!--<iframe id="chat_screen" class="card" src="chat_screen.html" title="chat screen"></iframe>-->
                <div id="sezione_chat"></div>
                <div class="user_input"><!-- SEZIONE INPUT UTENTE -->
                <div id="form_userinput">
                    <textarea id="user_chat_txtarea"></textarea>
                    <button id="send_user_chat_msg" class="roboto-flex-bold glow">Invia</button>
                </div>
            </div>
            </div>  

        

            <div class="footer"> <!-- FOOTER PER DATI AUTORE PAGINA, MAIL, ECC. -->
                <div id="firma">
                    <p>Made by Max<br/>maximilian.paruta@iscopy.it</p>
                </div>
            </div>   
        </section>

            <!-- FINESTRE MODALI PER FORM NUOVO PROGETTO O CONVERSAZIONE -->
        
            <!-- NUOVA CONVERSAZIONE -->
        <div id="modal_conv" class="modal_hidden tabcard card roboto-flex-std draggable">
            <div class="title_modal roboto-flex-bold">
                Nuova conversazione
            </div>

            <input type="text" id="conv_name" class="card_input-title" placeholder="Inserisci il topic dela conversazione">
            <textarea id="conv_descr" class="card_descr" placeholder="Inserisci una descrizione facoltativa"></textarea>
            
            <button id="ins_new_conv" class="arr_opener bttn glow btn-card-left" data-target_id="modal_conv">Inizia nuova conversazione</button>
            <button id="Annulla" class="arr_opener bttn glow btn-card-right" data-target_id="modal_conv">Annulla</button>
            
        </div>

            <!-- NUOVO PROGETTO -->
        <div id="modal_project" class="modal_hidden tabcard card roboto-flex-std draggable">
            <div class="title_modal roboto-flex-bold">
                Nuovo progetto
            </div>

            <input type="text" id="project_name" class="card_input-title" placeholder="Inserisci il nome del progetto">
            <textarea id="project_descr" class="card_descr" placeholder="Inserisci una descrizione facoltativa"></textarea>
  
            <button id="ins_new_proj" class="arr_opener bttn glow btn-card-left" data-target_id="modal_project">Conferma nuovo progetto</button>
            <button id="Annulla" class="arr_opener bttn glow btn-card-right" data-target_id="modal_project">Annulla</button>
         </div>

         <!-- DIV SEPARATORE -->
        <div id="separatore" class="modal_hidden"></div>
        <script src="script/main_script.js"></script>
        <script src="script/UI.js"></script>
    </body>
</html>
